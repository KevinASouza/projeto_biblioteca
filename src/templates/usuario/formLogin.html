{% extends "template.html" %}
{% block conteudo  %}
    <header class="navbar navbar-dark bg-dark px-4 py-3 shadow-sm justify-content-between">
        <h1 class="navbar-brand h1 mb-0 fs-3">{{ titulo }}</h1>
        <a href="{{ url_for('livro.listar_livros') }}" class="btn btn-secondary btn-enviar">Biblioteca</a>
    </header>

    <div class="container mt-5">
      <form class="container w-25 mx-auto p-4 shadow rounded" action="{{ url_for('usuario.autenticar') }}" method="POST">
            <input type="hidden" name="proxima" value="{{ proxima }}"> <!-- Pega o valor da variável passado no login !-->
            <div class="mb-3">
                <label for="titulo" class="form-label">Apelido</label>
                <input type="text" class="form-control" id="apelido" name="apelido" placeholder="Digite seu nome de usuário..." required>
            </div>

            <div class="mb-3">
                <label for="autor" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite sua senha..." required>
            </div>
            <button type="submit" class="btn btn-primary btn-enviar">Login</button>
            <a href="{{ url_for('usuario.get_form_cadastro') }}" style="padding-left: 20px">Não possui conta?</a>
        </form><br>
        <p>
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <ul id="messages" class="list-unstyled">
                    {% for message in messages %}
                        <li class="alert alert-danger">{{ message }}</li>
                    {% endfor %}
                    </ul>
                {% endif %}
            {% endwith %}
        </p>
    </div>
{% endblock %}
