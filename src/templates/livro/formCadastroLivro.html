{% extends "template.html" %}
{% block conteudo  %}
    <header class="navbar navbar-dark bg-dark px-4 py-3 shadow-sm justify-content-between">
        <h1 class="navbar-brand h1 mb-0 fs-3">{{ titulo }}</h1>
        <div>
            <a href="{{ url_for('livro.listar_livros') }}" class="btn btn-secondary btn-enviar">Biblioteca</a>
            <a href="{{ url_for('usuario.logout') }}" class="btn btn-danger ">Logout</a>
        </div>
    </header>

    <div class="container mt-5">
      <form class="container w-25 mx-auto p-4 shadow rounded" action="{{ url_for('livro.adicionar_livro') }}" method="POST">
            <div class="mb-3">
                <label for="titulo" class="form-label">Título</label>
                <input type="text" class="form-control" id="titulo" name="titulo" placeholder="Digite o título..." required>
            </div>

            <div class="mb-3">
                <label for="autor" class="form-label">Autor</label>
                <input type="text" class="form-control" id="autor" name="autor" placeholder="Nome do autor..." required>
            </div>

            <div class="mb-3">
                <label for="ano" class="form-label">Ano de Publicação</label>
                <input type="number" class="form-control" id="ano" name="ano" min="0" max="2100" placeholder="Ex: 2026" required>
            </div>
            <button type="submit" class="btn btn-primary btn-enviar">Salvar Dados</button>

        </form><br>
        <p>
            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <ul id="messages" class="list-unstyled">
                {% for message in messages %}
                <li class="alert alert-success">{{ message }}</li>
                {% endfor %}
            </ul>
            {% endif %}
            {% endwith %}
        </p>
    </div>


{% endblock %}
