{% extends "template.html" %}
{% block conteudo  %}
    <header class="navbar navbar-dark bg-dark px-4 py-3 shadow-sm justify-content-between">
        <h1 class="navbar-brand h1 mb-0 fs-3">{{ titulo }}</h1>
        <div>
            <a href="{{ url_for('livro.get_formulario') }}" class="btn btn-secondary btn-enviar">Cadastro</a>
            {% if logado %}
                <a href="{{ url_for('usuario.logout') }}" class="btn btn-danger ">{{ mensagem }}</a>
            {% else %}
                <a href="{{ url_for('livro.get_formulario') }}" class="btn btn-danger ">{{ mensagem }}</a>
            {% endif %}
        </div>
    </header>

    <main class="container my-5">
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            {% for livro in livros %}
            <div class="col">
                <article class="card h-100 shadow-sm border-0">
                    <div class="card-body">
                        <h2 class="card-title h5 text-primary mb-3">{{ livro.titulo }}</h2>
                        <p class="card-text text-muted mb-1"><strong>Autor:</strong> {{ livro.autor }}</p>
                        <p class="card-text text-muted"><strong>Ano de Publicação:</strong> {{ livro.ano }}</p>
                    </div>
                </article>
            </div>
            {% endfor %}
        </div>
    </main>
{% endblock %}
